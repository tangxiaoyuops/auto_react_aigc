# Phase 0 验证：把 AIMP Qwen 配成 headless 的模型 provider
- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          aimp-qwen:
            apiKeyEnv: AIMP_OPENAI_API_KEY
            api: openai-completions
            baseURL: https://aimpapi.midea.com/t-aigc/d-dban-qwen3-5-397b-a17b/v1
            models:
              - id: qwen3-5-397b-a17b
            compat:
              supportsDeveloperRole: false
              maxTokensField: max_tokens
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: aimp-qwen
        model: qwen3-5-397b-a17b